name: 쓰레드 자동 게시
on:
  schedule:
    # GitHub 예약 실행은 늦거나 빠질 수 있어서 여러 번 시도 (이미 올린 글은 다시 안 올림)
    - cron: "2,22,42 3-5 * * *"    # 한국 12시~14시대
    - cron: "2,22,42 10-12 * * *"  # 한국 19시~21시대
  workflow_dispatch:
    inputs:
      check_only:
        description: "게시 없이 확인할 사진·영상 파일 이름 (쉼표로 구분)"
        required: false
        default: ""
permissions:
  contents: write
concurrency:
  group: threads-post
  cancel-in-progress: false
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/post.py
        env:
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          CHECK_ONLY: ${{ github.event.inputs.check_only }}
      - if: always()
        run: |
          git config user.name "threads-bot"
          git config user.email "threads-bot@users.noreply.github.com"
          git add posted.json
          git diff --cached --quiet || (git commit -m "게시 기록" && git push)
